<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D24"/>
      <stop offset="100%" stop-color="#24204F"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FFC928"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9BBEFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- Sun -->
  <g transform="translate(125 130)">
    <circle cx="0" cy="0" r="43" fill="url(#sun)"/>

    <g stroke="#FFD84D" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-68" x2="0" y2="-92"/>
      <line x1="0" y1="68" x2="0" y2="92"/>
      <line x1="-68" y1="0" x2="-92" y2="0"/>
      <line x1="68" y1="0" x2="92" y2="0"/>

      <line x1="-48" y1="-48" x2="-65" y2="-65"/>
      <line x1="48" y1="-48" x2="65" y2="-65"/>
      <line x1="-48" y1="48" x2="-65" y2="65"/>
      <line x1="48" y1="48" x2="65" y2="65"/>
    </g>
  </g>

  <!-- Title -->
  <text x="270" y="105"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="12"
        fill="url(#text)">
    SAVITR
  </text>

  <!-- Subtitle -->
  <text x="275" y="150"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        fill="#D8E1FF">
    Software-Defined Adaptive Sonar Transmitter Payload
  </text>

  <!-- Secondary line -->
  <text x="275" y="185"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        fill="#B8C5E8">
    Low-Power • Real-Time • Autonomous Underwater Vehicles
  </text>

  <!-- SIH information -->
  <text x="275" y="222"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        fill="#FFD84D">
    SMART INDIA HACKATHON 2026 • ADAPTIVE SONAR • AUV
  </text>
</svg>
